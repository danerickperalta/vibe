<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hoot Spotter</title>
  <style>
     .tabs {
    display: flex;
    background: #EEE;
    padding: 16px 16px 0px 16px;
  }

  .tab {
    padding: 8px 16px;
    border: none;
    cursor: pointer;
    font-size: 14px;
  }

  .tab.active {
    background: white;
    color: black;
  }

  .panel {
    display: block;
  }

  .hidden {
    display: none;
  }
   
    body {
      font-family: system-ui, sans-serif;
      padding: 0px;
      margin: 0;
      color: #333;
    }

    .header-container {
      background: #1D1929;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 16px 16px 16px 16px;
      position: relative;
    }

    .header {
      display: flex;
      align-items: center;
    }
    
    .header h1 {
      font-size: 18px;
      font-weight: 500;
      color: white;
    }
    
    .header .logo {
      font-size: 20px;
    }

    .tooltip-icon {
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s ease;
      display: flex;
      align-items: center;
    }

    .tooltip-icon img {
      width: 18px;
      height: 18px;
      filter: brightness(0) invert(1); /* This will make the SVG white */
    }

    .tooltip-icon:hover {
      opacity: 1;
    }

    .intro-text {
      font-size: 14px;
      color: white;
      display: none;
      padding: 1px 16px 16px 16px;
      background-color: #1D1929;
    }

    .intro-text.visible {
      display: block;
    }
    
    .selection-section {
      padding: 32px 16px 4px 16px;
      border-radius: 4px;
      overflow: hidden;
    }
    
    .selection-card {
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 12px;
      background-color: #EEEEEE;
    }
    
    .selection-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .selection-status {
      display: none;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      background-color: #ffffff;
      padding: 4px 16px 4px 16px;
    }
    
    .selection-status.visible {
      display: flex;
    }
    
    .selection-name {
      color: #1D1929;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
    
    .button {
      padding: 8px 8px;
      border-radius: 100px;
      border: 0px solid #ddd;
      background-color: transparent;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .button:hover {
      background: #f5f5f5;
      padding: 8px 8px;
      border-radius: 100px;
    }
    
    .primary-button {
      background: white;
      color: #5254F6;
      padding: 12px;
      width: 100%;
      border-radius: 4px;
      border: 1px solid transparent;
    }
    
    .primary-button:hover {
      border-radius: 4px;
      border: 1px solid #5254F6; 
      cursor: pointer;
    }

    .screenshot-bkg{
      width: 100%;
      background: #EEEEEE;
    }
    
    .primary-button:disabled {
      background: #ccc;
      border-color: #bbb;
      cursor: not-allowed;
    }
    
    .scan-button {
      background: #dcddff;
      color: #5254F6;
      border: 1px solid #5254F6;
      cursor: pointer;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: 400;
      border-radius: 4px;
      width: 100%;
    }
    
    .scan-button:hover {
      background: #5254F6;
      border: 1px solid #5254F6;
      color: #ffffff;
      border: 1px solid #5254F6;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .scan-button.restart {
      background: #FFE8E8;
      color: #FF4D4D;
      border: 1px solid #FF4D4D;
    }

    .scan-button.restart:hover {
      background: #FF4D4D;
      color: #ffffff;
      border: 1px solid #FF4D4D;
    }

    .button-container {
      padding: 0px 16px 16px 16px;
      display: flex;
    }
    

    .master-results {
      padding: 0px 16px 16px 16px;
    }

    .results {
      border: 1px solid #E8E8EA;
      border-radius: 4px;
      overflow: hidden;
    }
    
    .hidden {
      display: none;
    }
    
    .score-card {
      overflow: hidden;
    }
    
    .score-header {
      padding: 24px 16px 24px 16px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    
    .excellent {
      background: #9dffa0;
      color: #1D1929;
    }
  
    .good {
      background: #e3ff9e;
      color: #1D1929;
    }

    .average {
      background: #ffe494;
      color: #1D1929;
    }

    .poor {
      background: #ffc36a;
      color: #1D1929;
    }

    .bad {
      background: #ffb4ae;
      color: #1D1929;
    }
    
    .score-title {
      font-weight: 400;
    }
    
    .score-value {
      font-size: 20px;
      font-weight: bold;
      color: #1D1929;
      padding: 2px 8px 2px 8px;
      background-color: rgb(255, 255, 255);
      border-radius: 100px;
    }
    
    .score-details {
      background: white;
    }
    
    .score-breakdown {
      display: flex;
      justify-content: space-between;
      padding: 16px;
    }
    
    .score-category {
      text-align: center;
      flex: 1;
      padding-bottom: 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .category-score {
      font-size: 16px;
      font-weight: bold;
    }
    
    .category-name {
      font-size: 14px;
      color: #666;
    }
    
    .insights {
      display: flex;
      flex-direction: column;
      gap: 8px; /* or however much vertical space you want */
      padding: 8px;
    }
    
    .insight {
      padding: 8px 16px 8px 16px;
      display: flex;
      background: #F8F8F8;
      border: 1px solid #E8E8EA;
      border-radius: 4px;
      gap: 8px;
    }
    
    .insight-icon {
      width: 20px;
      text-align: center;
    }
    
    .insight-text {
      font-size: 14px;
      flex: 1;
    }
    
    .no-results {
      padding: 24px 16px;
      text-align: center;
      color: #666;
    }

  
  </style>
</head>
<body>
    <div class="header-container">
      <div class="header">
        <h1>Hoot Spotter</h1>
        <span class="logo">🦉</span>
      </div>
      <div class="tooltip-icon" id="tooltip-toggle">
        <svg width="24" height="24" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18.18 18C18.6502 16.6633 19.5783 15.5362 20.7999 14.8183C22.0215 14.1003 23.4578 13.8379 24.8544 14.0774C26.2509 14.317 27.5176 15.043 28.4302 16.1271C29.3427 17.2111 29.8421 18.583 29.84 20C29.84 24 23.84 26 23.84 26M24 34H24.02M44 24C44 35.0457 35.0457 44 24 44C12.9543 44 4 35.0457 4 24C4 12.9543 12.9543 4 24 4C35.0457 4 44 12.9543 44 24Z" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
    <div class="intro-text" id="intro-text">
      <p>Hoot Spotter is your guide for staying visually aligned across projects.<br><br>1. Choose a Control, the source of truth for your design style.<br><br>2. Then select a Reference to see how well it matches your shared visual goals.</p>
    </div>
    <!-- Mode Tabs -->
<div class="tabs">
  <button class="tab active" data-mode="control">Control</button>
  <button class="tab" data-mode="reference">Reference</button>
</div>

  
  <div class="selection-section">
    <div class="selection-card">
      <div id="control-preview" class="screenshot-bkg">
        <!-- Image or placeholder goes here -->
      </div>
      <div class="selection-content">
        <div class="selection-status">
          <div id="control-name" class="selection-name">No library selected</div>
          <button id="focus-control" class="button" disabled>👁️</button>
          <button id="clear-control" class="button" title="Clear selection" disabled>❌</button>
        </div>
        <button id="set-control" class="primary-button">Set Design Library</button>
      </div>
    </div>
    
    <div class="selection-card">   
      <div id="reference-preview" class="screenshot-bkg">
        <!-- Image or placeholder will appear here -->
      </div>
      <div class="selection-content">
        <div class="selection-status">
          <div id="reference-name" class="selection-name">No component selected</div>
          <button id="focus-reference" class="button" disabled>👁️</button>
          <button id="clear-reference" class="button" title="Clear selection" disabled>❌</button>
        </div>
        <button id="set-reference" class="primary-button">Set Component</button>
      </div>
    </div>
  </div>
  
  <div class="master-results">
   <div id="results" class="results hidden">
    <!-- Results will be populated here -->
    </div>
  </div>
  <div class="button-container">
    <button id="run-scan" class="scan-button" disabled>Check Design Harmony</button>
  </div>

  
  <script>
    // DOM Elements
    const setControlBtn = document.getElementById('set-control');
    const setReferenceBtn = document.getElementById('set-reference');
    const runScanBtn = document.getElementById('run-scan');
    const focusControlBtn = document.getElementById('focus-control');
    const focusReferenceBtn = document.getElementById('focus-reference');
    const controlNameEl = document.getElementById('control-name');
    const referenceNameEl = document.getElementById('reference-name');
    const resultsContainer = document.getElementById('results');
    const clearControlBtn   = document.getElementById('clear-control');
    const clearReferenceBtn = document.getElementById('clear-reference');

    
    // State tracking
    let controlSet = false;
    let referenceSet = false;
    let hasScanned = false;

    
    // Initialize by trying to restore previous session
    window.onload = function() {
      parent.postMessage({ pluginMessage: { type: 'restore-session' } }, '*');
    };
    
    // Set control button
    setControlBtn.onclick = function() {
      parent.postMessage({ pluginMessage: { type: 'set-control' } }, '*');
    };
    
    // Set reference button
    setReferenceBtn.onclick = function() {
      parent.postMessage({ pluginMessage: { type: 'set-reference' } }, '*');
    };

    clearControlBtn.onclick = () => {
      // locally reset the UI for preview and status
      controlSet = false;
      controlNameEl.textContent = "No library selected";
      document.getElementById('control-preview').innerHTML = "";
      clearControlBtn.disabled = true;
      focusControlBtn.disabled = true;

      // Updated: Show primary button, hide selection status
      setControlBtn.style.display = 'block';
      document.querySelector('.selection-card:first-child .selection-status').classList.remove('visible');

      updateButtonStates();

      // tell the plugin code.ts we cleared it
      parent.postMessage({ pluginMessage: { type: 'clear-control' } }, '*');
    };

    clearReferenceBtn.onclick = () => {
      referenceSet = false;
      referenceNameEl.textContent = "No component selected";
      document.getElementById('reference-preview').innerHTML = "";
      clearReferenceBtn.disabled = true;
      focusReferenceBtn.disabled = true;

      // Updated: Show primary button, hide selection status
      setReferenceBtn.style.display = 'block';
      document.querySelector('.selection-card:last-child .selection-status').classList.remove('visible');

      updateButtonStates();

      parent.postMessage({ pluginMessage: { type: 'clear-reference' } }, '*');
    };

    // Run scan button
    runScanBtn.onclick = function() {
  if (!hasScanned) {
    if (controlSet && referenceSet) {
      parent.postMessage({
        pluginMessage: {
          type: 'run-scan',
        }
      }, '*');
      resultsContainer.innerHTML = '<div class="no-results">Analyzing design harmony...</div>';
      resultsContainer.classList.remove('hidden');
    }
  } else {
    parent.postMessage({ pluginMessage: { type: 'reset' } }, '*');
  }
};
    
    // Focus buttons
    focusControlBtn.onclick = function() {
      parent.postMessage({ pluginMessage: { type: 'focus-node', nodeId: 'control' } }, '*');
    };
    
    focusReferenceBtn.onclick = function() {
      parent.postMessage({ pluginMessage: { type: 'focus-node', nodeId: 'reference' } }, '*');
    };
    
    // Update button states
    function updateButtonStates() {
      runScanBtn.disabled = !(controlSet && referenceSet);
      focusControlBtn.disabled = !controlSet;
      focusReferenceBtn.disabled = !referenceSet;
    }
    
    // Get score class
    function getScoreClass(score) {
      if (score >= 90) return 'excellent';
      if (score >= 75) return 'good';
      if (score >= 60) return 'average';
      if (score >= 40) return 'poor';
      return 'bad';
    }
    
    // Get component type based on harmony score
    function getComponentType(harmony) {
      // Determine the most significant category
      const scores = [
        { type: 'Color', score: harmony.colorScore },
        { type: 'Shape', score: harmony.shapeScore },
        { type: 'Typography', score: harmony.typographyScore },
        { type: 'Spacing', score: harmony.spacingScore }
      ];
      
      // Sort by score to find the highest scoring category
      scores.sort((a, b) => b.score - a.score);
      
      // If the highest score is significantly higher than others, use that type
      if (scores[0].score > scores[1].score + 20) {
        return scores[0].type;
      }
      
      // If scores are close, return "Component" as a generic type
      return "Component";
    }

    // Get harmony message based on score and component type
    function getHarmonyMessage(score, componentType) {
      if (score >= 90) {
        return `${componentType} perfectly matches your design system!`;
      } else if (score >= 75) {
        return `${componentType} aligns well with your design system.`;
      } else if (score >= 60) {
        return `${componentType} has some inconsistencies with your design system.`;
      } else if (score >= 40) {
        return `${componentType} needs significant adjustments to match your design system.`;
      } else {
        return `${componentType} requires a complete redesign to match your design system.`;
      }
    }
    
    // Generate insights based on scores and patterns
    function generateInsights(componentType, harmony, patterns) {
      const insights = [];
      

      
      // Color insights
      if (harmony.colorScore < 70) {
        insights.push({
          icon: '🎨',
          text: `Consider using colors from your design system palette (${patterns.colorPalette.slice(0, 3).join(', ')}${patterns.colorPalette.length > 3 ? '...' : ''})`
        });
      } else {
        insights.push({
          icon: '✅',
          text: 'Colors align well with your design system palette.'
        });
      }
      
      // Shape insights
      if (harmony.shapeScore < 70) {
        insights.push({
          icon: '📐',
          text: `Your design system typically uses corner radii between ${patterns.cornerRadiusRange.min}px and ${patterns.cornerRadiusRange.max}px.`
        });
      }
      
      // Typography insights
      if (harmony.typographyScore < 70) {
        const fontFamilies = [...new Set(patterns.typographyStyles.map(s => s.family))];
        insights.push({
          icon: '📝',
          text: `Consider using consistent typography: ${fontFamilies.slice(0, 2).join(', ')}${fontFamilies.length > 2 ? '...' : ''}`
        });
      }
      
      // Spacing insights
      if (harmony.spacingScore < 70) {
        insights.push({
          icon: '↔️',
          text: `Your design system typically uses spacing values between ${patterns.spacingValues.min}px and ${patterns.spacingValues.max}px.`
        });
      }
      
      return insights;
    }
    
    // Render harmony score results
    function renderResults(result) {
      if (!result.success) {
        resultsContainer.innerHTML = `<div class="no-results">${result.message}</div>`;
        return;
      }
      
      const { harmony, patterns } = result;
      const scoreClass = getScoreClass(harmony.overallScore);
      const componentType = getComponentType(harmony);
      const insights = generateInsights(componentType, harmony, patterns);
      
      let html = `
        <div class="score-card">
          <div class="score-header ${scoreClass}">
            <div class="score-title">${getHarmonyMessage(harmony.overallScore, componentType)}</div>
            <div class="score-value">${harmony.overallScore}%</div>
          </div>
          <div class="score-details">
            <div class="score-breakdown">
              <div class="score-category">
                <div class="category-score">${harmony.colorScore}%</div>
                <div class="category-name">Color</div>
              </div>
              <div class="score-category">
                <div class="category-score">${harmony.shapeScore}%</div>
                <div class="category-name">Shape</div>
              </div>
              <div class="score-category">
                <div class="category-score">${harmony.typographyScore}%</div>
                <div class="category-name">Type</div>
              </div>
              <div class="score-category">
                <div class="category-score">${harmony.spacingScore}%</div>
                <div class="category-name">Spacing</div>
              </div>
            </div>
            <div class="insights">
      `;
      
      insights.forEach(insight => {
        html += `
          <div class="insight">
            <div class="insight-icon">${insight.icon}</div>
            <div class="insight-text">${insight.text}</div>
          </div>
        `;
      });
      
      html += `
            </div>
          </div>
        </div>
      `;
      
      resultsContainer.innerHTML = html;
    }
    
    // Message handler
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      
      if (msg.type === 'control-set') {
        document.getElementById('control-name').textContent = msg.name;

        if (msg.preview) {
          const container = document.getElementById('control-preview');
          container.innerHTML = "";

          const img = document.createElement('img');
          img.src = msg.preview;
          img.alt = "Control preview";
          img.style.maxHeight = "140px";
          img.style.width = "auto";
          img.style.maxWidth = "100%";
          img.style.objectFit = "contain";
          img.style.borderRadius = "6px";
          img.style.display = "block";
          img.style.margin = "0 auto";
          img.style.backgroundColor = "#EEEEEE";
          img.style.padding = "8px";
          img.style.boxSizing = "border-box";

          container.appendChild(img);
        }

        controlSet = true;
        controlNameEl.textContent       = msg.name;
        clearControlBtn.disabled        = false;
        focusControlBtn.disabled        = false;
        updateButtonStates();

        // Updated: Hide primary button, show selection status
        setControlBtn.style.display = 'none';
        document.querySelector('.selection-card:first-child .selection-status').classList.add('visible');
      }

      if (msg.type === 'reference-set') {
        document.getElementById('reference-name').textContent = msg.name;

        if (msg.preview) {
          const container = document.getElementById('reference-preview');
          container.innerHTML = "";

          const img = document.createElement('img');
          img.src = msg.preview;
          img.alt = "Reference preview";
          img.style.maxHeight = "140px";
          img.style.width = "auto";
          img.style.maxWidth = "100%";
          img.style.objectFit = "contain";
          img.style.borderRadius = "6px";
          img.style.display = "block";
          img.style.margin = "0 auto";
          img.style.backgroundColor = "#EEEEEE";
          img.style.padding = "8px";
          img.style.boxSizing = "border-box";

          container.appendChild(img);
        }

        referenceSet = true;
        referenceNameEl.textContent     = msg.name;
        clearReferenceBtn.disabled      = false;
        focusReferenceBtn.disabled      = false;
        updateButtonStates();

        // Updated: Hide primary button, show selection status
        setReferenceBtn.style.display = 'none';
        document.querySelector('.selection-card:last-child .selection-status').classList.add('visible');
      }

      if (msg.type === 'reset-complete') {
        hasScanned = false;
        runScanBtn.textContent = "Check Design Harmony";
        runScanBtn.classList.remove('restart');

        // Clear UI for preview and status
        controlSet = false;
        referenceSet = false;
        controlNameEl.textContent = "No library selected";
        referenceNameEl.textContent = "No component selected";
        document.getElementById('control-preview').innerHTML = "";
        document.getElementById('reference-preview').innerHTML = "";
        resultsContainer.innerHTML = "";
        resultsContainer.classList.add("hidden");
        
        // Updated: Show primary buttons, hide selection status
        setControlBtn.style.display = 'block';
        document.querySelector('.selection-card:first-child .selection-status').classList.remove('visible');
        setReferenceBtn.style.display = 'block';
        document.querySelector('.selection-card:last-child .selection-status').classList.remove('visible');
        
        updateButtonStates();
      }
      if (msg.type === 'scan-result') {
        if (msg.success) {
          hasScanned = true;
          runScanBtn.textContent = "Reset";
          runScanBtn.classList.add('restart');
        }

        renderResults(msg);
      }
    };
  </script>
  <script>
    const tabs = document.querySelectorAll(".tab");
    const panels = {
      control: document.getElementById("control-panel"),
      reference: document.getElementById("reference-panel"),
    };
  
    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        // Toggle tab UI
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
  
        // Toggle content panels
        const mode = tab.dataset.mode;
        Object.keys(panels).forEach(key => {
          panels[key].classList.toggle("hidden", key !== mode);
        });
      });
    });
  </script>
  
  <script>
    const tooltipToggle = document.getElementById('tooltip-toggle');
    const introText = document.getElementById('intro-text');

    tooltipToggle.addEventListener('click', () => {
      introText.classList.toggle('visible');
    });
  </script>
</body>
</html>
