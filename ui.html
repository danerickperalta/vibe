<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hoot Spotter</title>
  <style>
     .tabs {
    display: flex;
    background: #EEE;
    padding: 16px 16px 0px 16px;
  }

  .tab {
    padding: 8px 16px;
    border: none;
    cursor: pointer;
    font-size: 14px;
  }

  .tab.active {
    background: white;
    color: black;
  }

  .panel {
    display: block;
  }

  .hidden {
    display: none;
  }
   
    body {
      font-family: system-ui, sans-serif;
      padding: 0px;
      margin: 0;
      color: #333;
    }

    .header {
      display: flex;
      align-items: center;
      padding: 16px 16px 16px 16px;
      background: #1D1929;
    }
    
    .header h1 {
      font-size: 18px;
      font-weight: 400;
      color: white;
    }
    
    .header .logo {
      font-size: 20px;
    }
    
    .selection-section {
      padding: 32px 16px 32px 16px;
    }
    
    .selection-card {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 16px;
      margin-bottom: 12px;
      background-color: #EEEEEE;
      box-shadow: -2px -2px 1px 0px rgba(0, 0, 0, 0.15) inset, 2px 2px 4px 0px rgba(0, 0, 0, 0.15), 4px 4px 4px 0px rgba(255, 255, 255, 0.50) inset;

    }
    
  
    
    .selection-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
    }
    
    .selection-name {
      color: #666;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
    
    .button {
      padding: 10px 12px;
      border-radius: 0px;
      border: 0px solid #ddd;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .button:hover {
      background: #f5f5f5;
      border-radius: 4px;
    }
    
    .primary-button {
      background: white;
      color: #5254F6;
      padding: 12px;
      width: 100%;
      border-radius: 4px;
      border: 1px solid #E8E8EA;
    }
    
    .primary-button:hover {
      border-radius: 4px;
      border: 1px solid #5254F6; 
      cursor: pointer;
    }

    .screenshot-bkg{
      width: 100%;
      background: #EEEEEE;
    }
    
    .primary-button:disabled {
      background: #ccc;
      border-color: #bbb;
      cursor: not-allowed;
    }
    
    .scan-button {
      background: #5254F6;
      border: 0px;
      border-color: #FFA000;
      color: #ffffff;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: 400;
      border-radius: 4px;
      width: 100%;
      box-shadow: -2px -2px 1px 0px rgba(0, 0, 0, 0.15) inset, 2px 2px 4px 0px rgba(0, 0, 0, 0.15), 4px 4px 4px 0px rgba(255, 255, 255, 0.50) inset;
    }
    
    .scan-button:hover {
      background: #FFB300;
    }

    .button-container {
      padding: 0px 16px 32px 16px;
      display: flex;
    }
    
    .results {
    }
    
    .hidden {
      display: none;
    }
    
    .score-card {
      overflow: hidden;
      border-radius: 4px;
      padding: 0px 16px 32px 16px;
      border-radius: 4px;
    }
    
    .score-header {
      padding: 16px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .excellent { background: #4CAF50; }
    .good { background: #8BC34A; }
    .average { background: #FFC107; }
    .poor { background: #FF9800; }
    .bad { background: #F44336; }
    
    .score-title {
      font-weight: 600;
    }
    
    .score-value {
      font-size: 20px;
      font-weight: bold;
    }
    
    .score-details {
      background: white;
    }
    
    .score-breakdown {
      display: flex;
      justify-content: space-between;
      padding: 16px;
    }
    
    .score-category {
      text-align: center;
      flex: 1;
      padding-bottom: 8px;
    }
    
    .category-score {
      font-size: 18px;
      font-weight: bold;
    }
    
    .category-name {
      font-size: 12px;
      color: #666;
    }
    
    .insights {
      border-top: 1px solid #eee;
    }
    
    .insight {
      padding: 8px 16px 8px 16px;
      display: flex;
      background: #F8F8F8;
      border: 1px solid #E8E8EA;
      border-radius: 4px;
      gap: 8px;
    }
    
    .insight-icon {
      width: 20px;
      text-align: center;
    }
    
    .insight-text {
      font-size: 14px;
      flex: 1;
    }
    
    .no-results {
      padding: 24px 16px;
      text-align: center;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Hoot Spotter</h1>
    <span class="logo">🦉</span>
  </div>
    <!-- Mode Tabs -->
<div class="tabs">
  <button class="tab active" data-mode="control">Control</button>
  <button class="tab" data-mode="reference">Reference</button>
</div>

  
  <div class="selection-section">
    <div class="selection-card">
      <div id="control-preview" class="screenshot-bkg">
        <!-- Image goes here -->
      </div>
           
      <div class="selection-status">
        <div id="control-name" class="selection-name">No library selected</div>
        <button id="focus-control" class="button" disabled>👁️</button>
        <button id="clear-control" class="button" title="Clear selection" disabled>❌</button>

      </div>
      <button id="set-control" class="primary-button">Set Design Library</button>
    </div>
    
    <div class="selection-card">   
      <div id="reference-preview" class="screenshot-bkg">
        <!-- Image will appear here -->
      </div>   
      <div class="selection-status">
        <div id="reference-name" class="selection-name">No component selected</div>
        <button id="focus-reference" class="button" disabled>👁️</button>
        <button id="clear-reference" class="button" title="Clear selection" disabled>❌</button>
      </div>
      <button id="set-reference" class="primary-button">Set Component</button>
    </div>
  </div>
  
  <div id="results" class="results hidden">
    <!-- Results will be populated here -->
  </div>
  <div class="button-container">
    <button id="run-scan" class="scan-button" disabled>Check Design Harmony</button>
  </div>

  
  <script>
    // DOM Elements
    const setControlBtn = document.getElementById('set-control');
    const setReferenceBtn = document.getElementById('set-reference');
    const runScanBtn = document.getElementById('run-scan');
    const focusControlBtn = document.getElementById('focus-control');
    const focusReferenceBtn = document.getElementById('focus-reference');
    const controlNameEl = document.getElementById('control-name');
    const referenceNameEl = document.getElementById('reference-name');
    const resultsContainer = document.getElementById('results');
    const clearControlBtn   = document.getElementById('clear-control');
    const clearReferenceBtn = document.getElementById('clear-reference');

    
    // State tracking
    let controlSet = false;
    let referenceSet = false;
    let hasScanned = false;

    
    // Initialize by trying to restore previous session
    window.onload = function() {
      parent.postMessage({ pluginMessage: { type: 'restore-session' } }, '*');
    };
    
    // Set control button
    setControlBtn.onclick = function() {
      parent.postMessage({ pluginMessage: { type: 'set-control' } }, '*');
    };
    
    // Set reference button
    setReferenceBtn.onclick = function() {
      parent.postMessage({ pluginMessage: { type: 'set-reference' } }, '*');
    };

    clearControlBtn.onclick = () => {
  // locally reset the UI
  controlSet = false;
  controlNameEl.textContent       = "No library selected";
  document.getElementById('control-preview').innerHTML = "";
  clearControlBtn.disabled        = true;
  focusControlBtn.disabled        = true;
  updateButtonStates();

  // tell the plugin code.ts we cleared it
  parent.postMessage({ pluginMessage: { type: 'clear-control' } }, '*');
};

clearReferenceBtn.onclick = () => {
  referenceSet = false;
  referenceNameEl.textContent     = "No component selected";
  document.getElementById('reference-preview').innerHTML = "";
  clearReferenceBtn.disabled      = true;
  focusReferenceBtn.disabled      = true;
  updateButtonStates();

  parent.postMessage({ pluginMessage: { type: 'clear-reference' } }, '*');
};

// Run scan button
    runScanBtn.onclick = function() {
  if (!hasScanned) {
    if (controlSet && referenceSet) {
      parent.postMessage({
        pluginMessage: {
          type: 'run-scan',
        }
      }, '*');
      resultsContainer.innerHTML = '<div class="no-results">Analyzing design harmony...</div>';
      resultsContainer.classList.remove('hidden');
    }
  } else {
    parent.postMessage({ pluginMessage: { type: 'reset' } }, '*');
  }
};
    
    // Focus buttons
    focusControlBtn.onclick = function() {
      parent.postMessage({ pluginMessage: { type: 'focus-node', nodeId: 'control' } }, '*');
    };
    
    focusReferenceBtn.onclick = function() {
      parent.postMessage({ pluginMessage: { type: 'focus-node', nodeId: 'reference' } }, '*');
    };
    
    // Update button states
    function updateButtonStates() {
      runScanBtn.disabled = !(controlSet && referenceSet);
      focusControlBtn.disabled = !controlSet;
      focusReferenceBtn.disabled = !referenceSet;
    }
    
    // Get score class
    function getScoreClass(score) {
      if (score >= 90) return 'excellent';
      if (score >= 75) return 'good';
      if (score >= 60) return 'average';
      if (score >= 40) return 'poor';
      return 'bad';
    }
    
    // Generate insights based on scores and patterns
    function generateInsights(componentType, harmony, patterns) {
      const insights = [];
      
      // Color insights
      if (harmony.colorScore < 70) {
        insights.push({
          icon: '🎨',
          text: `Consider using colors from your design system palette (${patterns.colorPalette.slice(0, 3).join(', ')}${patterns.colorPalette.length > 3 ? '...' : ''})`
        });
      } else {
        insights.push({
          icon: '✅',
          text: 'Colors align well with your design system palette.'
        });
      }
      
      // Shape insights
      if (harmony.shapeScore < 70) {
        insights.push({
          icon: '📐',
          text: `Your design system typically uses corner radii between ${patterns.cornerRadiusRange.min}px and ${patterns.cornerRadiusRange.max}px.`
        });
      }
      
      // Typography insights
      if (harmony.typographyScore < 70) {
        const fontFamilies = [...new Set(patterns.typographyStyles.map(s => s.family))];
        insights.push({
          icon: '📝',
          text: `Consider using consistent typography: ${fontFamilies.slice(0, 2).join(', ')}${fontFamilies.length > 2 ? '...' : ''}`
        });
      }
      
      // Spacing insights
      if (harmony.spacingScore < 70) {
        insights.push({
          icon: '↔️',
          text: `Your design system typically uses spacing values between ${patterns.spacingValues.min}px and ${patterns.spacingValues.max}px.`
        });
      }
      
      return insights;
    }
    
    // Render harmony score results
    function renderResults(result) {
      if (!result.success) {
        resultsContainer.innerHTML = `<div class="no-results">${result.message}</div>`;
        return;
      }
      
      const { componentType, harmony, patterns } = result;
      const scoreClass = getScoreClass(harmony.overallScore);
      const insights = generateInsights(componentType, harmony, patterns);
      
      let html = `
        <div class="score-card">
          <div class="score-header ${scoreClass}">
            <div class="score-title">${componentType} Harmony</div>
            <div class="score-value">${harmony.overallScore}%</div>
          </div>
          <div class="score-details">
            <div class="score-breakdown">
              <div class="score-category">
                <div class="category-score">${harmony.colorScore}%</div>
                <div class="category-name">Color</div>
              </div>
              <div class="score-category">
                <div class="category-score">${harmony.shapeScore}%</div>
                <div class="category-name">Shape</div>
              </div>
              <div class="score-category">
                <div class="category-score">${harmony.typographyScore}%</div>
                <div class="category-name">Type</div>
              </div>
              <div class="score-category">
                <div class="category-score">${harmony.spacingScore}%</div>
                <div class="category-name">Spacing</div>
              </div>
            </div>
            <div class="insights">
      `;
      
      insights.forEach(insight => {
        html += `
          <div class="insight">
            <div class="insight-icon">${insight.icon}</div>
            <div class="insight-text">${insight.text}</div>
          </div>
        `;
      });
      
      html += `
            </div>
          </div>
        </div>
      `;
      
      resultsContainer.innerHTML = html;
    }
    
    // Message handler
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      
      if (msg.type === 'control-set') {
  document.getElementById('control-name').textContent = msg.name;

  if (msg.preview) {
    const container = document.getElementById('control-preview');
    container.innerHTML = "";

    const img = document.createElement('img');
    img.src = msg.preview;
    img.alt = "Control preview";
    img.style.maxHeight = "140px";
img.style.width = "auto";
img.style.maxWidth = "100%";
img.style.objectFit = "contain";
img.style.borderRadius = "6px";
img.style.display = "block";
img.style.margin = "0 auto";
img.style.backgroundColor = "#EEEEEE";
img.style.padding = "8px";
img.style.boxSizing = "border-box";


    container.appendChild(img);
  }

  controlSet = true;
  controlNameEl.textContent       = msg.name;
    clearControlBtn.disabled        = false;
    focusControlBtn.disabled        = false;
  updateButtonStates();
}


      
if (msg.type === 'reference-set') {
  document.getElementById('reference-name').textContent = msg.name;

  if (msg.preview) {
    const container = document.getElementById('reference-preview');
    container.innerHTML = "";

    const img = document.createElement('img');
    img.src = msg.preview;
    img.alt = "Reference preview";
    img.style.maxHeight = "140px";
    img.style.width = "auto";
    img.style.maxWidth = "100%";
    img.style.objectFit = "contain";
    img.style.borderRadius = "6px";
    img.style.display = "block";
    img.style.margin = "0 auto";
    img.style.backgroundColor = "#EEEEEE";
    img.style.padding = "8px";
    img.style.boxSizing = "border-box";

    container.appendChild(img);
  }

  referenceSet = true;
  referenceNameEl.textContent     = msg.name;
    clearReferenceBtn.disabled      = false;
    focusReferenceBtn.disabled      = false;
  updateButtonStates();
}

      
if (msg.type === 'reset-complete') {
  hasScanned = false;
  runScanBtn.textContent = "Check Design Harmony";

  // Clear UI
  controlSet = false;
  referenceSet = false;
  controlNameEl.textContent = "No library selected";
  referenceNameEl.textContent = "No component selected";
  document.getElementById('control-preview').innerHTML = "";
  document.getElementById('reference-preview').innerHTML = "";
  resultsContainer.innerHTML = "";
  resultsContainer.classList.add("hidden");
  updateButtonStates();
}
if (msg.type === 'scan-result') {
  if (msg.success) {
    hasScanned = true;
    runScanBtn.textContent = "Restart";
  }

  renderResults(msg);
}
    };
  </script>
  <script>
    const tabs = document.querySelectorAll(".tab");
    const panels = {
      control: document.getElementById("control-panel"),
      reference: document.getElementById("reference-panel"),
    };
  
    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        // Toggle tab UI
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
  
        // Toggle content panels
        const mode = tab.dataset.mode;
        Object.keys(panels).forEach(key => {
          panels[key].classList.toggle("hidden", key !== mode);
        });
      });
    });
  </script>
  
</body>
</html>
